# ==========================================================
# 日本株スクリーニング条件設定ファイル
# ここを編集するだけで通知条件を変更できます。
# 各セクションの enabled: true/false でオン・オフを切り替えられます。
# ==========================================================

# 株価データの取得元
#   "yfinance" : 無料・登録不要(Yahoo!ファイナンスの非公式ライブラリ)。まずはこちらを推奨
#   "jquants"  : J-Quants API(要登録。無料プランは12週間遅延のため実運用には有料プラン(月1,650円〜)が必要)
data_source: "yfinance"

# スクリーニング対象市場 (J-QuantsのMarketCodeで絞り込み。空なら全市場)
# 例: プライム=0111, スタンダード=0112, グロース=0113
target_markets: []   # 例: ["0111", "0112", "0113"]

# 出来高が極端に少ない銘柄を除外(流動性フィルタ)
min_avg_volume: 10000   # 過去20日平均出来高がこれ未満の銘柄は除外

# ------------------------------------------------------------
# 1. ゴールデンクロス / デッドクロス
# ------------------------------------------------------------
golden_dead_cross:
  enabled: true
  short_window: 5      # 短期移動平均線の日数
  long_window: 25       # 長期移動平均線の日数
  notify_golden: true   # ゴールデンクロス(短期が長期を上抜け)を通知
  notify_dead: true     # デッドクロス(短期が長期を下抜け)を通知

# ------------------------------------------------------------
# 2. RSI・ストキャスティクス(過熱感指標)
# ------------------------------------------------------------
overheat_indicators:
  enabled: true
  rsi:
    enabled: true
    period: 14
    oversold: 30    # RSIがこれ以下 → 売られすぎ通知
    overbought: 70  # RSIがこれ以上 → 買われすぎ通知
  stochastic:
    enabled: true
    k_period: 14
    d_period: 3
    oversold: 20
    overbought: 80

# ------------------------------------------------------------
# 3. 出来高急増・株価ブレイクアウト
# ------------------------------------------------------------
volume_breakout:
  enabled: true
  volume_surge:
    enabled: true
    lookback_days: 20     # 平均出来高の算出期間
    surge_multiple: 3.0   # 平均出来高の何倍で急増と判定するか
  price_breakout:
    enabled: true
    lookback_days: 60     # 直近高値・安値を判定する期間
    breakout_type: "both" # "high"(高値更新のみ) / "low"(安値更新のみ) / "both"

# ------------------------------------------------------------
# 4. ボリンジャーバンド 3シグマ
# ------------------------------------------------------------
bollinger_band:
  enabled: true
  window: 20
  sigma: 3.0   # ±何σを逸脱したら通知するか

# ------------------------------------------------------------
# 5. 後場での急落 (※要 J-Quants プレミアムプラン: ザラ場/前後場データが必要)
# ------------------------------------------------------------
afternoon_drop:
  enabled: false   # プレミアムプラン契約後に true にしてください
  drop_threshold_pct: -3.0   # 前場終値→後場(現在値 or 大引け)がこの%以上下落したら通知

# ------------------------------------------------------------
# 6. 意識されやすい価格帯(移動平均線・直近高値安値・キリの良い株価)
#    こうした水準の近くでは売買が入りやすく、反発・反落のきっかけになりやすいとされる
#    (経験則であり、必ずそうなることを保証するものではない)
# ------------------------------------------------------------
watched_levels:
  enabled: true
  moving_average:
    enabled: true
    windows: [25, 75, 200]   # 多くの投資家が意識しやすい移動平均線(日数)
    threshold_pct: 1.5        # 終値がこの%以内に接近していたら該当
  recent_extreme:
    enabled: true
    lookback_days: 60         # 直近高値・安値の判定期間
    threshold_pct: 2.0
  round_number:
    enabled: true
    threshold_pct: 1.5        # キリの良い株価にこの%以内で接近していたら該当

# ------------------------------------------------------------
# 7. 過去の類似パターン検索(一覧画面に勝率・平均リターンを表示)
#    該当銘柄の直近の値動きが過去のどの局面に似ているかを探し、その後どうなったかを集計する
# ------------------------------------------------------------
pattern_match:
  enabled: true
  max_stocks: 150      # 該当銘柄が多い場合、スコア上位何件まで調べるか(サーバー負荷抑制のため)
  sleep_between: 0.3   # 1銘柄ごとの取得間隔(秒)

# ------------------------------------------------------------
# 通知関連
# ------------------------------------------------------------
notification:
  max_items_per_message: 30   # LINE 1通あたりに詰め込む最大銘柄数(超えたら分割送信)
  quiet_if_no_match: true     # 該当銘柄がゼロのときは通知を送らない
  # プッシュ通知を送るシグナルカテゴリ(ここに無いカテゴリは、一覧画面には表示されるが通知は送らない)
  notify_categories:
    - oversold
    - overbought
    - golden_cross
    - dead_cross
    - breakout
    - volume_surge
