<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>日本株スクリーニング通知</title>
<link rel="manifest" href="/manifest.json" />
<link rel="stylesheet" href="/style.css" />
<link rel="icon" href="/icon-192.png" />
<meta name="theme-color" content="#0b1120" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<link rel="apple-touch-icon" href="/icon-192.png" />
</head>
<body>
<header>
  <h1>日本株スクリーニング通知</h1>
  <div class="updated" id="updated-at">読み込み中...</div>
  <div class="subscribe-bar">
    <button id="subscribe-btn">通知を有効にする</button>
    <button id="refresh-btn" class="secondary">今すぐ更新</button>
    <a href="/settings.html" class="secondary" style="text-decoration:none;display:inline-block;padding:10px 14px;border:1px solid #263248;border-radius:8px;color:#e5e7eb;font-size:14px;">設定</a>
  </div>
  <div id="status-text"></div>
</header>
<main>
  <div class="summary" id="summary"></div>
  <div class="view-tabs" id="view-tabs">
    <button class="view-tab active" data-view="signal">シグナル別</button>
    <button class="view-tab" data-view="theme">テーマ別(業種)</button>
    <button class="view-tab" data-view="heatmap">ヒートマップ</button>
    <button class="view-tab" data-view="favorites">お気に入り</button>
  </div>
  <div id="results"></div>
</main>
<div class="modal hidden" id="chart-modal">
  <div class="modal-backdrop" id="chart-modal-backdrop"></div>
  <div class="modal-panel">
    <button class="modal-close" id="chart-modal-close" aria-label="閉じる">×</button>
    <div id="chart-modal-body"></div>
  </div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/3.9.1/chart.min.js"></script>
<script src="/app.js"></script>
</body>
</html>
